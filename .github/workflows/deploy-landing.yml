name: Deploy landing

on:
  push:
    branches: [main]
    paths:
      - "apps/landing/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-landing.yml"
  workflow_dispatch: {}

# Only the latest push to main should actually deploy -- an in-flight
# deploy from an older commit getting superseded mid-flight by a newer one
# is exactly the kind of thing to avoid for a public site.
concurrency:
  group: deploy-landing
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Node dependencies (npm workspaces: all packages/apps in one install,
      # same as the main CI workflow).
      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace=apps/landing

      # opennextjs-cloudflare build && opennextjs-cloudflare deploy (see
      # apps/landing/package.json's "deploy" script) -- builds the Next.js
      # app, transforms it into a Cloudflare Worker, and publishes it via
      # wrangler. Requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
      # as repo secrets (Settings -> Secrets and variables -> Actions) --
      # see docs/architecture/landing-deployment.md for how to create them.
      - name: Build and deploy to Cloudflare Workers
        working-directory: apps/landing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
